<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Calculadora de Energia</title>
    <style>
        :root {
            --primary: #00c853;
            --primary-dark: #009624;
            --primary-light: #5efc82;
            --secondary: #b0bec5;
            --background: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --text-light: #9e9e9e;
            --error: #ff5252;
            --success: #69f0ae;
            --border: #333333;
        }
        
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
        }
        
        body {
            background-color: var(--background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
        }

        .logo {
            width: 180px;
            margin-bottom: 30px;
            filter: brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #2a2a2a;
            font-size: 15px;
            transition: all 0.2s;
            color: var(--text);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 200, 83, 0.2);
        }

        .form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            font-weight: bold;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
        }

        .btn-secondary {
            background-color: #2a2a2a;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: #333333;
            border-color: #444;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-value {
            font-weight: 600;
            color: var(--primary);
            font-size: 16px;
        }

        .error {
            color: var(--error);
            font-weight: 500;
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
            padding: 10px;
            background: rgba(255, 82, 82, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .hidden {
            display: none;
        }

        .icon {
            font-size: 20px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(0, 200, 83, 0.2);
            color: var(--primary);
        }

        .input-error {
            border-color: var(--error) !important;
        }

        .error-text {
            color: var(--error);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card" id="form-container">
        <h2 class="title"><i class="bi bi-lightning-charge-fill icon"></i> CÁLCULO DE ENERGIA</h2>
        
        <form id="main-form">
            <div class="form-group">
                <label for="codigo"><i class="bi bi-upc-scan icon"></i> CÓDIGO DO CLIENTE</label>
                <input type="text" id="codigo" name="codigo" placeholder="Digite o código" required>
            </div>
            
            <div class="form-group">
                <label for="leitura-inicial"><i class="bi bi-speedometer icon"></i> LEITURA INICIAL (kWh)</label>
                <input type="number" id="leitura-inicial" name="leitura-inicial" placeholder="0" required>
                <div class="error-text" id="error-inicial">A leitura inicial não pode ser maior que a final</div>
            </div>
            
            <div class="form-group">
                <label for="leitura-final"><i class="bi bi-speedometer2 icon"></i> LEITURA FINAL (kWh)</label>
                <input type="number" id="leitura-final" name="leitura-final" placeholder="0" required>
                <div class="error-text" id="error-final">A leitura final não pode ser menor que a inicial</div>
            </div>
            
            <div class="form-group">
                <label for="tipo-cliente"><i class="bi bi-people-fill icon"></i> TIPO DE CLIENTE</label>
                <select id="tipo-cliente" name="tipo-cliente" required>
                    <option value="">Selecione o tipo...</option>
                    <option value="Residência">Residência</option>
                    <option value="Comércio">Comércio</option>
                    <option value="Industria">Indústria</option>
                </select>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary"><i class="bi bi-calculator-fill"></i> CALCULAR</button>
                <button type="reset" class="btn btn-secondary"><i class="bi bi-eraser-fill"></i> LIMPAR</button>
            </div>
        </form>
    </div>

    <div class="card hidden" id="results-container">
        <h2 class="title"><i class="bi bi-receipt-cutoff icon"></i> DETALHES DA CONTA</h2>
        
        <div class="form-group">
            <div class="result-item">
                <span><i class="bi bi-upc-scan"></i> CÓDIGO:</span>
                <span class="result-value" id="result-codigo"></span>
            </div>
            
            <div class="result-item">
                <span><i class="bi bi-lightning-charge"></i> CONSUMO:</span>
                <span class="result-value" id="result-total-kwh"> kWh</span>
            </div>
            
            <div class="result-item">
                <span><i class="bi bi-person-badge"></i> TIPO:</span>
                <span class="result-value"><span id="result-tipo-cliente"></span> <span class="badge" id="result-tarifa"></span></span>
            </div>
            
            <div class="divider"></div>
            
            <div class="result-item">
                <span><i class="bi bi-currency-dollar"></i> VALOR TOTAL:</span>
                <span class="result-value" id="result-valor-total"></span>
            </div>
        </div>
        
        <form id="payment-form">
            <div class="form-group">
                <label for="valor-pago"><i class="bi bi-cash-stack icon"></i> VALOR PAGO (R$)</label>
                <input type="number" id="valor-pago" name="valor-pago" step="0.01" placeholder="0.00" required>
            </div>
            
            <div id="error-message" class="error hidden"></div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary"><i class="bi bi-wallet2"></i> CALCULAR TROCO</button>
                <button type="button" id="back-btn" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> VOLTAR</button>
            </div>
        </form>
    </div>

    <div class="card hidden" id="troco-container">
        <h2 class="title"><i class="bi bi-wallet2 icon"></i> RECIBO DE PAGAMENTO</h2>
        
        <div class="form-group">
            <div class="result-item">
                <span><i class="bi bi-receipt"></i> VALOR TOTAL:</span>
                <span class="result-value" id="troco-valor-total"></span>
            </div>
            
            <div class="result-item">
                <span><i class="bi bi-cash-coin"></i> VALOR PAGO:</span>
                <span class="result-value" id="troco-valor-pago"></span>
            </div>
            
            <div class="divider"></div>
            
            <div class="result-item">
                <span><i class="bi bi-coin"></i> TROCO:</span>
                <span class="result-value" id="troco-resultado"></span>
            </div>
        </div>
        
        <div class="button-group">
            <button type="button" id="new-calculation" class="btn btn-primary"><i class="bi bi-plus-circle"></i> NOVA CONTA</button>
        </div>
    </div>

    <script>
        const mainForm = document.getElementById('main-form');
        const paymentForm = document.getElementById('payment-form');
        const formContainer = document.getElementById('form-container');
        const resultsContainer = document.getElementById('results-container');
        const trocoContainer = document.getElementById('troco-container');
        const backBtn = document.getElementById('back-btn');
        const newCalculationBtn = document.getElementById('new-calculation');
        const errorMessage = document.getElementById('error-message');
        const leituraInicialInput = document.getElementById('leitura-inicial');
        const leituraFinalInput = document.getElementById('leitura-final');
        const errorInicial = document.getElementById('error-inicial');
        const errorFinal = document.getElementById('error-final');

        let contaData = {
            codigo: '',
            totalKwh: 0,
            tipoCliente: '',
            valorTotal: 0,
            tarifa: ''
        };

        mainForm.addEventListener('submit', handleMainFormSubmit);
        paymentForm.addEventListener('submit', handlePaymentFormSubmit);
        backBtn.addEventListener('click', goBackToForm);
        newCalculationBtn.addEventListener('click', resetAllForms);
        leituraInicialInput.addEventListener('input', validateReadings);
        leituraFinalInput.addEventListener('input', validateReadings);

        function validateReadings() {
            const inicial = parseFloat(leituraInicialInput.value) || 0;
            const final = parseFloat(leituraFinalInput.value) || 0;
            
            if (inicial > final) {
                leituraInicialInput.classList.add('input-error');
                leituraFinalInput.classList.add('input-error');
                errorInicial.style.display = 'block';
                errorFinal.style.display = 'block';
                return false;
            } else {
                leituraInicialInput.classList.remove('input-error');
                leituraFinalInput.classList.remove('input-error');
                errorInicial.style.display = 'none';
                errorFinal.style.display = 'none';
                return true;
            }
        }

        function handleMainFormSubmit(e) {
            e.preventDefault();
            
            if (!validateReadings()) {
                return;
            }
            
            contaData.codigo = document.getElementById('codigo').value;
            const leituraInicial = parseFloat(leituraInicialInput.value);
            const leituraFinal = parseFloat(leituraFinalInput.value);
            contaData.tipoCliente = document.getElementById('tipo-cliente').value;
            
            contaData.totalKwh = leituraFinal - leituraInicial;
            
            switch(contaData.tipoCliente) {
                case 'Residência':
                    contaData.valorTotal = contaData.totalKwh * 0.6 * 1.10;
                    contaData.tarifa = 'Tarifa Residencial';
                    break;
                case 'Comércio':
                    contaData.valorTotal = contaData.totalKwh * 0.48 * 1.12;
                    contaData.tarifa = 'Tarifa Comercial';
                    break;
                case 'Industria':
                    contaData.valorTotal = contaData.totalKwh * 1.29 * 1.15;
                    contaData.tarifa = 'Tarifa Industrial';
                    break;
                default:
                    alert('Tipo de cliente inválido!');
                    return;
            }
            
            document.getElementById('result-codigo').textContent = contaData.codigo;
            document.getElementById('result-total-kwh').textContent = contaData.totalKwh.toFixed(2);
            document.getElementById('result-tipo-cliente').textContent = contaData.tipoCliente;
            document.getElementById('result-tarifa').textContent = contaData.tarifa;
            document.getElementById('result-valor-total').textContent = `R$ ${contaData.valorTotal.toFixed(2)}`;
            
            formContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
        }

        function handlePaymentFormSubmit(e) {
            e.preventDefault();
            
            const valorPago = parseFloat(document.getElementById('valor-pago').value);
            
            if (valorPago < contaData.valorTotal) {
                errorMessage.textContent = "Valor pago é menor que o valor da conta!";
                errorMessage.classList.remove('hidden');
                return;
            }
            
            const troco = valorPago - contaData.valorTotal;
            
            document.getElementById('troco-valor-total').textContent = `R$ ${contaData.valorTotal.toFixed(2)}`;
            document.getElementById('troco-valor-pago').textContent = `R$ ${valorPago.toFixed(2)}`;
            document.getElementById('troco-resultado').textContent = `R$ ${troco.toFixed(2)}`;
            
            resultsContainer.classList.add('hidden');
            trocoContainer.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function goBackToForm() {
            resultsContainer.classList.add('hidden');
            formContainer.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function resetAllForms() {
            mainForm.reset();
            paymentForm.reset();
            errorMessage.classList.add('hidden');
            trocoContainer.classList.add('hidden');
            formContainer.classList.remove('hidden');
            leituraInicialInput.classList.remove('input-error');
            leituraFinalInput.classList.remove('input-error');
            errorInicial.style.display = 'none';
            errorFinal.style.display = 'none';
        }
    </script>
</body>
</html>
