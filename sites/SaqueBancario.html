<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <title>Saque Bancário</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000428, #004e92);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #f0da15;
            text-shadow: 0 0 10px rgba(240, 218, 21, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
            font-family: "Segoe UI", sans-serif;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
        }

        .form-group input {
            width: 60%;
            padding: 12px 15px;
            border-radius: 8px;
            margin-left: 20%;
            border: none;
            background: aliceblue;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            width: 200px;
            background: #f0da15;
            color: #000;
            font-family: "Segoe UI", sans-serif;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.4s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #ffeb3b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .results {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .results h2 {
            color: #f0da15;
            margin-bottom: 20px;
            text-align: center;
        }

        .note-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: "Segoe UI", sans-serif;
            font-weight: bold;
        }

        .note-value {
            font-weight: bold;
            color: #f0da15;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="bi bi-bank"></i> SAQUE BANCÁRIO</h1>
        </div>

        <div id="form-section">
            <form name="calculos" onsubmit="calcularNotas(event)">
                <div class="form-group">
                    <label for="valorSaque"><i class="bi bi-cash-stack"></i> DIGITE O VALOR DO SAQUE:</label>
                    <input type="number" name="saque" id="valorSaque" required />
                </div>

                <div class="button-group">
                    <button type="submit" class="btn"><i class="bi bi-arrow-right-square-fill"></i> ENVIAR</button>
                    <button type="reset" class="btn btn-secondary"><i class="bi bi-eraser-fill"></i> LIMPAR</button>
                </div>
            </form>
        </div>

        <div id="results-section" class="results">
            <h2><i class="bi bi-receipt"></i> RESULTADO DO SAQUE</h2>

            <div class="form-group">
                <label><i class="bi bi-currency-dollar"></i> VALOR DO SAQUE:</label>
                <input type="text" id="valorExibido" readonly />
            </div>

            <div class="form-group">
                <label><i class="bi bi-cash-stack"></i> QUANTIDADE DE NOTAS:</label>

                <div class="note-result">
                    <span><i class="bi bi-cash-coin"></i> NOTAS DE R$100:</span>
                    <span class="note-value" id="qtd100">0</span>
                </div>

                <div class="note-result">
                    <span><i class="bi bi-cash-coin"></i>NOTAS DE R$50:</span>
                    <span class="note-value" id="qtd50">0</span>
                </div>

                <div class="note-result">
                    <span><i class="bi bi-cash-coin"></i> NOTAS DE R$20:</span>
                    <span class="note-value" id="qtd20">0</span>
                </div>

                <div class="note-result">
                    <span><i class="bi bi-cash-coin"></i> NOTAS DE R$10:</span>
                    <span class="note-value" id="qtd10">0</span>
                </div>

                <div class="note-result">
                    <span><i class="bi bi-cash-coin"></i> NOTAS DE R$5:</span>
                    <span class="note-value" id="qtd5">0</span>
                </div>

                <div class="note-result">
                    <span><i class="bi bi-cash-coin"></i> NOTAS DE R$1:</span>
                    <span class="note-value" id="qtd1">0</span>
                </div>
            </div>

            <div class="button-group">
                <button type="button" onclick="voltar()" class="btn btn-secondary"><i class="bi bi-arrow-left-square-fill"></i> VOLTAR</button>
            </div>
        </div>
    </div>

    <script>
        function calcularNotas(event) {
            event.preventDefault();

            const saque = parseInt(document.getElementById("valorSaque").value);

            if (isNaN(saque)) {
                alert("Por favor, digite um valor numérico válido.");
                return;
            }

            if (saque <= 0) {
                alert("O valor do saque deve ser maior que zero.");
                return;
            }

            const nota100 = Math.floor(saque / 100);
            let resto = saque % 100;

            const nota50 = Math.floor(resto / 50);
            resto = resto % 50;

            const nota20 = Math.floor(resto / 20);
            resto = resto % 20;

            const nota10 = Math.floor(resto / 10);
            resto = resto % 10;

            const nota5 = Math.floor(resto / 5);
            resto = resto % 5;

            const nota1 = resto;

            document.getElementById("valorExibido").value = `R$ ${saque.toFixed(2)}`;
            document.getElementById("qtd100").textContent = nota100;
            document.getElementById("qtd50").textContent = nota50;
            document.getElementById("qtd20").textContent = nota20;
            document.getElementById("qtd10").textContent = nota10;
            document.getElementById("qtd5").textContent = nota5;
            document.getElementById("qtd1").textContent = nota1;

            document.getElementById("form-section").style.display = "none";
            document.getElementById("results-section").style.display = "block";
        }

        function voltar() {
            document.getElementById("form-section").style.display = "block";
            document.getElementById("results-section").style.display = "none";
            document.getElementById("valorSaque").value = "";
            document.getElementById("valorSaque").focus();
        }
    </script>
</body>

</html>
